name: Build Windows DYG Packager

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/DuyuanyinDygPackager/**'
      - '.github/workflows/build-windows-dyg-packager.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish self-contained EXE
        run: dotnet publish tools/DuyuanyinDygPackager/DuyuanyinDygPackager.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o dist
      - name: Package artifact
        uses: actions/upload-artifact@v4
        with:
          name: DUYUANJIN-DYG-Packager-Windows-x64
          path: |
            dist/DuyuanyinDygPackager.exe
            tools/DuyuanyinDygPackager/README.md
          if-no-files-found: error
